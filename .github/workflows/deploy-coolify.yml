on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger-coolify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Backend & Web
        env:
          COOLIFY_WEBHOOK: https://coolify.dragonwarriorsfa.com/webhooks/source/github/events/manual
          SECRET_BACKEND: ${{ secrets.COOLIFY_WEBHOOK_SECRET_BACKEND }}
          SECRET_WEB: ${{ secrets.COOLIFY_WEBHOOK_SECRET_WEB }}
        run: |
          set -e
          payload=$(jq -n --arg branch "main" --arg repo "june-arch/tani-iot" '{ref: ("refs/heads/"+$branch), repository: {full_name: $repo}, commits: [{message: "deploy"}]}')
          for SECRET in "$SECRET_BACKEND" "$SECRET_WEB"; do
            if [ -z "$SECRET" ]; then echo "skip empty secret"; continue; fi
            SIG=$(echo -n "$payload" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $2}')
            echo "Triggering with secret ${SECRET:0:4}... -> $SIG"
            curl -s -X POST "$COOLIFY_WEBHOOK" -H "Content-Type: application/json" -H "X-GitHub-Event: push" -H "X-Hub-Signature-256: sha256=$SIG" -H "X-GitHub-Delivery: $(uuidgen 2>/dev/null || cat /proc/sys/kernel/random/uuid)" -d "$payload" | head -c 500
            echo ""
          done
